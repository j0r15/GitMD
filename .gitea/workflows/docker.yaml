name: Docker

on:
  push:
    branches:
      - main

concurrency:
  group: docker
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set GitHub server URL
        id: server-url
        shell: bash
        run: |
          # Remove the protocol prefix from the server URL
          SERVER_URL="${{ github.server_url }}"
          SERVER_URL="${SERVER_URL#https://}"
          SERVER_URL="${SERVER_URL#http://}"
          # Get the owner/repo from github.repository (format: owner/repo)
          OWNER_REPO="${{ github.repository }}"
          # Output the server URL and owner/repo
          echo "GITHUB_SERVER_URL=$SERVER_URL" >> $GITHUB_OUTPUT
          echo "GITHUB_OWNER_REPO=$OWNER_REPO" >> $GITHUB_OUTPUT

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.server-url.outputs.GITHUB_SERVER_URL }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.server-url.outputs.GITHUB_SERVER_URL }}/${{ steps.server-url.outputs.GITHUB_OWNER_REPO }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.server-url.outputs.GITHUB_SERVER_URL }}/${{ steps.server-url.outputs.GITHUB_OWNER_REPO }}:buildcache
          cache-to: type=registry,ref=${{ steps.server-url.outputs.GITHUB_SERVER_URL }}/${{ steps.server-url.outputs.GITHUB_OWNER_REPO }}:buildcache,mode=max
