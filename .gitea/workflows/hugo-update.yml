name: Hugo Version Update Check

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
  schedule:
    - cron: '0 0 * * 2'  # Weekly on Tuesday at midnight

jobs:
  hugo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.170.0'  # Current version from Dockerfile
          extended: true

      - name: Check for newer Hugo releases
        run: |
          echo "Current Hugo version: 0.170.0"
          echo "Checking for newer releases at https://github.com/gohugoio/hugo/releases"

      - name: Install latest Hugo
        run: |
          wget -qO- https://github.com/gohugoio/hugo/releases/download/v0.171.0/hugo_extended_0.171.0_linux-amd64.tar.gz | \
            tar -C /tmp -xzf - -O hugo > /tmp/hugo && \
            echo "Downloaded Hugo 0.171.0 for testing"
